{% extends "base.html" %}
{% block title %}动态监测 - 蔬果智能识别系统{% endblock %}
{% block content %}
<div class="grid-2">
  <div class="card">
    <h2>摄像头画面</h2>
    <div style="position:relative; background:#000; border-radius:12px; overflow:hidden; min-height:300px; display:flex; align-items:center; justify-content:center;">
      <video id="video" autoplay playsinline style="width:100%; display:block;"></video>
      <canvas id="canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>
      <div id="camHint" style="position:absolute; color:#fff; text-align:center; padding:20px;">点击「开启摄像头」开始实时识别</div>
    </div>
    <div style="margin-top:16px; display:flex; gap:12px;">
      <button class="btn btn-primary" id="startBtn" style="flex:1;">开启摄像头</button>
      <button class="btn btn-secondary" id="stopBtn" style="flex:1;" disabled>停止监测</button>
    </div>
  </div>
  <div class="card">
    <h2>实时识别结果</h2>
    <div id="result"><div class="placeholder">等待摄像头启动</div></div>
  </div>
</div>

<script>
const video = document.getElementById('video'), canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn'), stopBtn = document.getElementById('stopBtn');
const camHint = document.getElementById('camHint'), result = document.getElementById('result');
let stream = null, timer = null, running = false;

startBtn.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    camHint.style.display = 'none';
    startBtn.disabled = true; stopBtn.disabled = false;
    running = true;
    timer = setInterval(captureAndPredict, 800);
  } catch (e) {
    alert('无法打开摄像头：' + e.message);
  }
};

stopBtn.onclick = stopCam;

function stopCam() {
  running = false;
  if (timer) clearInterval(timer);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  camHint.style.display = 'block';
  startBtn.disabled = false; stopBtn.disabled = true;
  result.innerHTML = '<div class="placeholder">监测已停止</div>';
}

async function captureAndPredict() {
  if (!running) return;
  const tmp = document.createElement('canvas');
  tmp.width = video.videoWidth; tmp.height = video.videoHeight;
  tmp.getContext('2d').drawImage(video, 0, 0);
  const b64 = tmp.toDataURL('image/jpeg', 0.8);

  try {
    const res = await fetch('/predict', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: b64 })
    });
    const data = await res.json();
    if (!data.results) return;
    drawOverlay(data.results[0]);
    renderResult(data.results);
  } catch (e) { console.error(e); }
}

function drawOverlay(top) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const w = canvas.width, h = canvas.height;
  const bw = Math.min(w, h) * 0.6, bh = bw;
  const x = (w - bw) / 2, y = (h - bh) / 2;
  ctx.strokeStyle = '#43a047'; ctx.lineWidth = 3;
  ctx.strokeRect(x, y, bw, bh);
  ctx.fillStyle = 'rgba(67,160,71,0.85)';
  ctx.fillRect(x, y - 44, ctx.measureText(top.cn).width + 160, 44);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Microsoft YaHei';
  ctx.fillText(`${top.cn} ${top.prob}%`, x + 12, y - 12);
}

function renderResult(r) {
  const top = r[0];
  result.innerHTML = `
    <div class="main-result"><span class="name">${top.cn}</span>
      <span class="kind">${top.kind}</span>
      <span style="color:#43a047; font-size:18px;">${top.prob}%</span></div>
    ${r.map(x => `<div class="bar-row"><div class="lab"><span>${x.cn}（${x.label}）</span><span>${x.prob}%</span></div>
      <div class="bar"><div style="width:${x.prob}%"></div></div></div>`).join('')}`;
}
</script>
{% endblock %}
